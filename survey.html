<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>R&D Health Check — Survey</title>
<!--
  RESPONDENT SURVEY PAGE (static · deploy to GitHub Pages)
  Reads ?s=<surveyId>&api=<workerBaseUrl>[&t=<token>][&e=<email>]
  Invite links generated by the Worker already include s, api, t, e.
  No secrets here. Responses POST to the Worker; nothing is stored in this page.
-->
<style>
:root{--green:#0E8A5F;--green-d:#0a6647;--accent:#15b37e;--ink:#16231f;--muted:#5d6d68;--line:#e4eae7;--bg:#f4f7f6;--card:#fff;
--l1:#d1495b;--l2:#e8a838;--l3:#7bb274;--l4:#1f9d61;--chip:#eef4f1;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
.bar{background:linear-gradient(90deg,var(--green-d),var(--green));color:#fff;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:9px}
.bar .dot{width:10px;height:10px;border-radius:50%;background:#bff3df;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(16,40,32,.08);padding:20px;margin-bottom:16px}
h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
label.fld{display:block;margin-bottom:12px}label.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q .qt{font-weight:600;margin-bottom:3px}.q .qd{color:var(--muted);font-size:13px;margin-bottom:9px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.opts{grid-template-columns:repeat(4,1fr)}}
.opt{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 10px;text-align:left;font-size:12.5px;line-height:1.3;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .ol{font-weight:700;display:block;margin-bottom:2px}
.opt.sel{color:#fff;border-color:transparent}
.opt.sel[data-l="1"]{background:var(--l1)}.opt.sel[data-l="2"]{background:var(--l2)}.opt.sel[data-l="3"]{background:var(--l3)}.opt.sel[data-l="4"]{background:var(--l4)}
.na{margin-top:6px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-block}
.qcl{display:block;font-size:11.5px;color:var(--muted);margin-top:9px;margin-bottom:4px}
.qc{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;resize:vertical;min-height:40px}
.qc:focus{outline:none;border-color:var(--accent)}
.modhdr{display:flex;align-items:center;gap:10px;margin:6px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);color:var(--green-d)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--green-d)}.btn:disabled{opacity:.5;cursor:not-allowed}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:center}
.prog{flex:1;max-width:360px;height:8px;border-radius:6px;background:#eef1f0;overflow:hidden}.prog>span{display:block;height:100%;background:var(--green)}
.msg{padding:14px;border-radius:10px;font-size:14px}.msg.err{background:#fdeef0;color:#a3303f}.msg.ok{background:#eef9f2;color:#0a6647}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.center{max-width:560px;margin:60px auto;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div class="bar"><span class="dot"></span> R&amp;D Health Check</div>
<div id="root" class="wrap"><div class="card"><span class="spin" style="border-top-color:var(--green)"></span> Loading survey…</div></div>
<script>
"use strict";
const PARAMS=new URLSearchParams(location.search);
const SID=PARAMS.get("s"); const TOKEN=PARAMS.get("t")||""; const EMAIL=PARAMS.get("e")||"";
/* API base: from ?api= (invite links include it) or set this constant when deploying */
const API_BASE=(PARAMS.get("api")||"https://YOUR-WORKER.workers.dev").replace(/\/$/,"");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=document.getElementById("root");
let DEF=null, ANSWERS={}, COMMENTS={};

function fail(m){ root.innerHTML=`<div class="center"><h1>Survey unavailable</h1><div class="msg err">${esc(m)}</div></div>`; }

async function load(){
  if(!SID){ return fail("Missing survey link parameters. Please use the link from your invitation email."); }
  if(API_BASE.includes("YOUR-WORKER")){ return fail("Survey endpoint not configured. (Deployment: set the Worker URL.)"); }
  try{
    const r=await fetch(`${API_BASE}/survey?s=${encodeURIComponent(SID)}`);
    if(!r.ok) throw new Error("Could not load survey ("+r.status+").");
    DEF=await r.json();
    render();
  }catch(e){ fail(e.message||"Could not load the survey."); }
}

function render(){
  const scale=DEF.scale||["Lagging","Developing","Established","Leading"];
  const segs=DEF.segments||{};
  const regions=segs.region||["EU","NA","AP","LATAM","MEA"];
  const funcs=segs.function||["Engineering","Other"];
  let h=`<div class="card"><h1>${esc(DEF.title||"R&D Health Check")}</h1>
    <div class="sub">${esc(DEF.client||"")}${DEF.industry?" · "+esc(DEF.industry):""} — please rate each item on a 1–4 maturity scale. ~10–15 minutes. Your responses support an R&D diagnostic.</div>
    <label class="fld"><span>Your name (optional)</span><input id="r_name" type="text" placeholder="(optional)"></label>
    <label class="fld"><span>Email</span><input id="r_email" type="email" value="${esc(EMAIL)}" placeholder="name@company.com"></label>
    <label class="fld"><span>Region</span><select id="r_region">${regions.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
    <label class="fld" style="margin:0"><span>Function</span><select id="r_function">${funcs.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
   </div>`;
  const dims={}; (DEF.items||[]).forEach(it=>{ (dims[it.dim]=dims[it.dim]||[]).push(it); });
  Object.keys(dims).forEach(dim=>{
    h+=`<div class="card"><div class="modhdr"><span class="pill">${esc(dim)}</span></div>`;
    dims[dim].forEach(it=>{
      h+=`<div class="q"><div class="qt">${esc(it.q||it.n)}</div>${it.q&&it.n&&it.q!==it.n?`<div class="qd">${esc(it.n)}</div>`:""}
        <div class="opts">`+(it.a||scale).map((txt,i)=>`<button class="opt" data-it="${esc(it.k)}" data-score="${i+1}" data-l="${i+1}"><span class="ol">${i+1} · ${esc(scale[i]||"")}</span>${esc(txt)}</button>`).join("")+`</div>
        <span class="na" data-na="${esc(it.k)}">Not sure / not applicable</span>
        <label class="qcl" for="qc_${esc(it.k)}">Describe your observations about what is not working well / improvement areas:</label>
        <textarea class="qc" id="qc_${esc(it.k)}" data-qc="${esc(it.k)}" rows="2" placeholder="(optional)"></textarea></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div id="submitMsg"></div>`;
  root.innerHTML=h;
  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.it,sc=+b.dataset.score;
    ANSWERS[k]=(ANSWERS[k]===sc?undefined:sc); if(ANSWERS[k]===undefined)delete ANSWERS[k];
    root.querySelectorAll(`.opt[data-it="${CSS.escape(k)}"]`).forEach(x=>x.classList.toggle("sel",+x.dataset.score===ANSWERS[k])); prog(); }));
  root.querySelectorAll("[data-na]").forEach(s=>s.addEventListener("click",()=>{ const k=s.dataset.na; delete ANSWERS[k]; root.querySelectorAll(`.opt[data-it="${CSS.escape(k)}"]`).forEach(x=>x.classList.remove("sel")); prog(); }));
  root.querySelectorAll("[data-qc]").forEach(t=>t.addEventListener("input",()=>{ const k=t.dataset.qc; const v=t.value.trim(); if(v)COMMENTS[k]=v; else delete COMMENTS[k]; }));
  document.body.insertAdjacentHTML("beforeend",`<div class="footer"><div class="prog"><span id="progbar" style="width:0%"></span></div><button class="btn" id="submitBtn">Submit</button></div>`);
  document.getElementById("submitBtn").addEventListener("click",submit);
  prog();
}
function prog(){ const tot=(DEF.items||[]).length||1; const done=Object.keys(ANSWERS).length; const el=document.getElementById("progbar"); if(el)el.style.width=Math.round(done/tot*100)+"%"; }
async function submit(){
  const btn=document.getElementById("submitBtn"); const msg=document.getElementById("submitMsg");
  const email=(document.getElementById("r_email").value||"").trim();
  if(Object.keys(ANSWERS).length===0){ msg.innerHTML=`<div class="msg err">Please answer at least one item before submitting.</div>`; window.scrollTo(0,document.body.scrollHeight); return; }
  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Submitting…`;
  const payload={ s:SID, t:TOKEN, respondent:{ name:(document.getElementById("r_name").value||"").trim(), email, region:document.getElementById("r_region").value, function:document.getElementById("r_function").value }, answers:ANSWERS, comments:COMMENTS, ts:new Date().toISOString() };
  try{
    const r=await fetch(`${API_BASE}/submit`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error("Submit failed ("+r.status+").");
    document.querySelector(".footer").remove();
    root.innerHTML=`<div class="center"><h1>Thank you</h1><div class="msg ok">Your responses have been recorded. You can close this page.</div></div>`;
  }catch(e){ msg.innerHTML=`<div class="msg err">${esc(e.message||"Submit failed — please try again.")}</div>`; btn.disabled=false; btn.textContent="Submit"; }
}
load();
</script>
</body>
</html>
