<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>R&D Health Check — Survey</title>
<!--
  RESPONDENT SURVEY PAGE (static · deploy to GitHub Pages)
  Reads ?s=<surveyId>&api=<workerBaseUrl>[&t=<token>][&e=<email>]
  Invite links generated by the Worker already include s, api, t, e.
  No secrets here. Responses POST to the Worker; nothing is stored in this page.
  Visual language: BCG-style premium editorial microsite (mint/lime gradient hero,
  dark-green serif headline, clean sans body, rounded floating cards, lime CTA).
-->
<style>
:root{
  /* BCG premium palette */
  --green-dark:#0E2B16;      /* headlines / brand */
  --green-mid:#0E8A5F;
  --charcoal:#222529;        /* body text, titles */
  --soft-black:#454A4C;      /* secondary text */
  --bg:#ffffff;              /* page background */
  --card:#ffffff;
  --card-soft:#F9F9F6;       /* floating nav card */
  --card-mint:#F0FDF6;       /* utility / mint card */
  --panel:#E6E7E4;           /* overlay panel */
  --line:#e7ece9;            /* soft separators */
  --cta:#95F878;             /* lime CTA */
  --cta-hover:#84F064;
  --cta-active:#72DF7C;
  --cta-ink:#111816;
  /* maturity levels */
  --l1:#d1495b;--l2:#e8a838;--l3:#5bb98a;--l4:#1f9d61;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"BCG Henderson Sans",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--charcoal);background:var(--bg);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"BCG Henderson Serif",Georgia,"Times New Roman",serif}

/* ---- gradient hero band ---- */
.hero{
  position:relative;
  background:linear-gradient(90deg,#E7FCE6 0%,#F3FFF0 28%,#D7FBEC 50%,#B8F8AD 75%,#9DF1C9 100%);
  padding:34px 20px 40px;
}
.hero-inner{max-width:820px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.brandrow .dot{width:12px;height:12px;border-radius:50%;background:var(--green-dark);box-shadow:0 0 0 4px rgba(14,43,22,.12)}
.brandrow .bn{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-dark)}
.hero h1{
  font-family:"BCG Henderson Serif",Georgia,serif;
  color:var(--green-dark);font-weight:500;letter-spacing:-.02em;
  font-size:44px;line-height:1.06;margin:0 0 14px;
}
.hero .lead{font-size:18px;line-height:1.4;color:var(--charcoal);max-width:680px;margin:0}
.hero .client{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green-mid);margin:0 0 10px}
/* info chips (time / dimensions / scale) */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.chip{
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 16px;
  box-shadow:0 4px 16px rgba(14,43,22,.08);
}
.chip .ic{width:22px;height:22px;flex:none;color:var(--green-dark)}
.chip .ct{display:flex;flex-direction:column;line-height:1.1}
.chip .cn{font-size:16px;font-weight:800;color:var(--green-dark)}
.chip .cl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft-black)}

/* ---- content ---- */
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:26px 26px 22px;margin-bottom:22px}
h2{font-size:20px;margin:0 0 3px;color:var(--charcoal)}
.sub{color:var(--soft-black);font-size:14px;margin:0 0 4px}

/* respondent fields */
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
label.fld{display:block;margin:0}
label.fld>span{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft-black);margin-bottom:6px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:#ffff;color:var(--charcoal)}
input:focus,select:focus{outline:none;border-color:var(--green-mid);box-shadow:0 0 0 3px rgba(14,138,95,.12)}

/* dimension pill */
.modhdr{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.pill{display:inline-block;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--card-mint);color:var(--green-dark);border:1px solid #d7f0e4}

/* question block */
.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:8px}
.q .qt{font-weight:700;font-size:16px;margin-bottom:3px;color:var(--charcoal)}
.q .qd{color:var(--soft-black);font-size:13.5px;margin-bottom:12px}

/* rating options — vertical rows for clean, readable long descriptions */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:16px;background:#fff;
  padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--charcoal);
  transition:border-color .12s,box-shadow .12s,background .12s;
}
.opt:hover{border-color:var(--green-mid);box-shadow:0 2px 10px rgba(14,138,95,.08)}
.opt .lvl{
  flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;
}
.opt[data-l="1"] .lvl{background:var(--l1)}
.opt[data-l="2"] .lvl{background:var(--l2)}
.opt[data-l="3"] .lvl{background:var(--l3)}
.opt[data-l="4"] .lvl{background:var(--l4)}
.opt .otxt{flex:1;min-width:0}
.opt .ol{display:block;font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:2px}
.opt .od{display:block;font-size:14px;line-height:1.4;color:var(--soft-black)}
.opt.sel{border-color:transparent;color:#fff}
.opt.sel .od{color:rgba(255,255,255,.92)}
.opt.sel[data-l="1"]{background:var(--l1)}
.opt.sel[data-l="2"]{background:var(--l2)}
.opt.sel[data-l="3"]{background:var(--l3)}
.opt.sel[data-l="4"]{background:var(--l4)}
.opt.sel .lvl{background:rgba(255,255,255,.25)}

.na{margin-top:10px;font-size:12.5px;color:var(--soft-black);cursor:pointer;display:inline-block;font-weight:600}
.na:hover{color:var(--green-mid)}
.qcl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--soft-black);margin-top:14px;margin-bottom:6px}
.qc{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;resize:vertical;min-height:44px;color:var(--charcoal)}
.qc:focus{outline:none;border-color:var(--green-mid);box-shadow:0 0 0 3px rgba(14,138,95,.12)}

/* CTA / footer */
.btn{
  display:inline-flex;align-items:center;gap:12px;background:var(--cta);color:var(--cta-ink);
  border:0;border-radius:18px;padding:0 30px;height:56px;font-size:15px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(114,223,124,.35);transition:background .12s;
}
.btn:hover{background:var(--cta-hover)}
.btn:active{background:var(--cta-active)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:16px;justify-content:center}
.prog{flex:1;max-width:420px;height:10px;border-radius:8px;background:#eef1f0;overflow:hidden}
.prog>span{display:block;height:100%;background:linear-gradient(90deg,var(--green-mid),var(--l4));transition:width .2s}
.pctxt{font-size:12px;font-weight:700;color:var(--soft-black);min-width:82px}
@media(max-width:560px){.pctxt{display:none}}

.msg{padding:14px 16px;border-radius:14px;font-size:14px}
.msg.err{background:#fdeef0;color:#a3303f}.msg.ok{background:#eef9f2;color:#0a6647}
.spin{width:16px;height:16px;border:2px solid rgba(17,24,22,.3);border-top-color:var(--cta-ink);border-radius:50%;animation:s .7s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.center{max-width:620px;margin:80px auto;text-align:center;padding:0 20px}
.center h1{font-family:"BCG Henderson Serif",Georgia,serif;color:var(--green-dark);font-weight:500;font-size:40px;margin:0 0 16px}
@media(max-width:560px){.hero h1{font-size:32px}}
</style>
</head>
<body>
<div id="root">
  <div class="hero"><div class="hero-inner">
    <div class="brandrow"><span class="dot"></span><span class="bn">R&amp;D Health Check</span></div>
    <h1>Loading survey…</h1>
  </div></div>
  <div class="wrap"><div class="card"><span class="spin"></span> Please wait…</div></div>
</div>
<script>
"use strict";
const PARAMS=new URLSearchParams(location.search);
const SID=PARAMS.get("s"); const TOKEN=PARAMS.get("t")||""; const EMAIL=PARAMS.get("e")||"";
/* API base: from ?api= (invite links include it) or set this constant when deploying */
const API_BASE=(PARAMS.get("api")||"https://YOUR-WORKER.workers.dev").replace(/\/$/,"");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=document.getElementById("root");
let DEF=null, ANSWERS={}, COMMENTS={};

function fail(m){
  root.innerHTML=`<div class="hero"><div class="hero-inner">
    <div class="brandrow"><span class="dot"></span><span class="bn">R&amp;D Health Check</span></div>
    <h1>Survey unavailable</h1></div></div>
    <div class="wrap"><div class="card"><div class="msg err">${esc(m)}</div></div></div>`;
}

async function load(){
  if(!SID){ return fail("Missing survey link parameters. Please use the link from your invitation email."); }
  if(API_BASE.includes("YOUR-WORKER")){ return fail("Survey endpoint not configured. (Deployment: set the Worker URL.)"); }
  try{
    const r=await fetch(`${API_BASE}/survey?s=${encodeURIComponent(SID)}`);
    if(!r.ok) throw new Error("Could not load survey ("+r.status+").");
    DEF=await r.json();
    render();
  }catch(e){ fail(e.message||"Could not load the survey."); }
}

/* small inline icons for the info chips */
const IC={
  clock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  grid:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  scale:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

function render(){
  const scale=DEF.scale||["Lagging","Developing","Established","Leading"];
  const segs=DEF.segments||{};
  const countries=segs.region||["Germany","United States","China","Japan","France","United Kingdom","Other"];
  const funcs=segs.function||["Research","Technology Development","Engineering","Testing & Validation","Software, Digital & AI","Product, Project & Program Management","Other"];
  const nDims=Object.keys((DEF.items||[]).reduce((a,it)=>{a[it.dim]=1;return a;},{})).length;
  const nItems=(DEF.items||[]).length;

  let h=`<div class="hero"><div class="hero-inner">
    <div class="brandrow"><span class="dot"></span><span class="bn">R&amp;D Health Check</span></div>
    ${DEF.client?`<p class="client">${esc(DEF.client)}${DEF.industry?" · "+esc(DEF.industry):""}</p>`:""}
    <h1>${esc(DEF.title||"R&D Health Check")}</h1>
    <p class="lead">Please rate each item on a 1–4 maturity scale. Your responses support an evidence-based R&amp;D diagnostic — there are no right or wrong answers.</p>
    <div class="chips">
      <div class="chip">${IC.clock}<div class="ct"><span class="cn">~10–15 min</span><span class="cl">Time to complete</span></div></div>
      <div class="chip">${IC.grid}<div class="ct"><span class="cn">${nDims} dimensions</span><span class="cl">${nItems} items</span></div></div>
      <div class="chip">${IC.scale}<div class="ct"><span class="cn">1–4 scale</span><span class="cl">${esc(scale[0])} → ${esc(scale[3]||scale[scale.length-1])}</span></div></div>
    </div>
  </div></div>
  <div class="wrap">`;

  h+=`<div class="card">
    <h2>About you</h2>
    <div class="sub">Used only to group anonymised results — your name is optional.</div>
    <div class="grid2" style="margin-top:16px">
      <label class="fld"><span>Your name (optional)</span><input id="r_name" type="text" placeholder="(optional)"></label>
      <label class="fld"><span>Email</span><input id="r_email" type="email" value="${esc(EMAIL)}" placeholder="name@company.com"></label>
      <label class="fld"><span>Country</span><select id="r_country">${countries.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
      <label class="fld"><span>Function</span><select id="r_function">${funcs.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
      <label class="fld" id="fnOtherFld" style="display:none"><span>Other, please specify</span><input id="r_function_other" type="text" placeholder="Describe your function"></label>
    </div>
   </div>`;

  const dims={}; (DEF.items||[]).forEach(it=>{ (dims[it.dim]=dims[it.dim]||[]).push(it); });
  Object.keys(dims).forEach(dim=>{
    h+=`<div class="card"><div class="modhdr"><span class="pill">${esc(dim)}</span></div>`;
    dims[dim].forEach(it=>{
      h+=`<div class="q"><div class="qt">${esc(it.q||it.n)}</div>${it.q&&it.n&&it.q!==it.n?`<div class="qd">${esc(it.n)}</div>`:""}
        <div class="opts">`+(it.a||scale).map((txt,i)=>`<button class="opt" data-it="${esc(it.k)}" data-score="${i+1}" data-l="${i+1}"><span class="lvl">${i+1}</span><span class="otxt"><span class="ol">${esc(scale[i]||"")}</span><span class="od">${esc(txt)}</span></span></button>`).join("")+`</div>
        <span class="na" data-na="${esc(it.k)}">Not sure / not applicable</span>
        <label class="qcl" for="qc_${esc(it.k)}">Observations — what is not working well / improvement areas</label>
        <textarea class="qc" id="qc_${esc(it.k)}" data-qc="${esc(it.k)}" rows="2" placeholder="(optional)"></textarea></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div id="submitMsg"></div></div>`;
  root.innerHTML=h;

  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.it,sc=+b.dataset.score;
    ANSWERS[k]=(ANSWERS[k]===sc?undefined:sc); if(ANSWERS[k]===undefined)delete ANSWERS[k];
    root.querySelectorAll(`.opt[data-it="${CSS.escape(k)}"]`).forEach(x=>x.classList.toggle("sel",+x.dataset.score===ANSWERS[k])); prog(); }));
  root.querySelectorAll("[data-na]").forEach(s=>s.addEventListener("click",()=>{ const k=s.dataset.na; delete ANSWERS[k]; root.querySelectorAll(`.opt[data-it="${CSS.escape(k)}"]`).forEach(x=>x.classList.remove("sel")); prog(); }));
  root.querySelectorAll("[data-qc]").forEach(t=>t.addEventListener("input",()=>{ const k=t.dataset.qc; const v=t.value.trim(); if(v)COMMENTS[k]=v; else delete COMMENTS[k]; }));
  const fn=document.getElementById("r_function"), fnOther=document.getElementById("fnOtherFld");
  const toggleOther=()=>{ fnOther.style.display=(fn.value==="Other")?"block":"none"; };
  fn.addEventListener("change",toggleOther); toggleOther();

  document.body.insertAdjacentHTML("beforeend",`<div class="footer"><div class="prog"><span id="progbar" style="width:0%"></span></div><span class="pctxt" id="pctxt">0% complete</span><button class="btn" id="submitBtn">Submit</button></div>`);
  document.getElementById("submitBtn").addEventListener("click",submit);
  prog();
}
function prog(){ const tot=(DEF.items||[]).length||1; const done=Object.keys(ANSWERS).length; const pct=Math.round(done/tot*100);
  const el=document.getElementById("progbar"); if(el)el.style.width=pct+"%";
  const tx=document.getElementById("pctxt"); if(tx)tx.textContent=pct+"% complete"; }
async function submit(){
  const btn=document.getElementById("submitBtn"); const msg=document.getElementById("submitMsg");
  const email=(document.getElementById("r_email").value||"").trim();
  if(Object.keys(ANSWERS).length===0){ msg.innerHTML=`<div class="msg err">Please answer at least one item before submitting.</div>`; window.scrollTo(0,document.body.scrollHeight); return; }
  let func=document.getElementById("r_function").value;
  if(func==="Other"){ const o=(document.getElementById("r_function_other").value||"").trim(); if(o) func="Other: "+o; }
  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Submitting…`;
  const payload={ s:SID, t:TOKEN, respondent:{ name:(document.getElementById("r_name").value||"").trim(), email, region:document.getElementById("r_country").value, function:func }, answers:ANSWERS, comments:COMMENTS, ts:new Date().toISOString() };
  try{
    const r=await fetch(`${API_BASE}/submit`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error("Submit failed ("+r.status+").");
    const f=document.querySelector(".footer"); if(f)f.remove();
    root.innerHTML=`<div class="hero"><div class="hero-inner"><div class="brandrow"><span class="dot"></span><span class="bn">R&amp;D Health Check</span></div><h1>Thank you</h1></div></div>
      <div class="center"><div class="msg ok">Your responses have been recorded. You can close this page.</div></div>`;
    window.scrollTo(0,0);
  }catch(e){ msg.innerHTML=`<div class="msg err">${esc(e.message||"Submit failed — please try again.")}</div>`; btn.disabled=false; btn.textContent="Submit"; }
}
load();
</script>
</body>
</html>
